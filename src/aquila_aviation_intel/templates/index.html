<!DOCTYPE html>
<html lang="fr" class="dark">
<head>
  {% include "layout/head.html" %}
</head>
<body class="bg-slate-950 text-slate-100 antialiased h-screen overflow-hidden">
  <div id="app" class="h-screen flex flex-col relative">
    
    <!-- Cyber Military Radar Grid Background -->
    <div class="absolute inset-0 bg-[linear-gradient(to_right,#06b6d408_1px,transparent_1px),linear-gradient(to_bottom,#06b6d408_1px,transparent_1px)] bg-[size:3rem_3rem] pointer-events-none"></div>

    <!-- 1. STICKY COMMAND HEADER -->
    {% include "layout/header.html" %}

    <!-- 2. MAIN WORKSPACE: MAP VIEWPORT + SIDEBAR INSPECTOR -->
    <main class="flex-1 flex flex-col md:flex-row gap-3 p-3 overflow-hidden relative z-10">
      
      <!-- Center / Left: Interactive 2D/3D Tactical Viewport -->
      <section class="flex-1 flex flex-col h-full min-w-0">
        {% include "components/map_viewport.html" %}
      </section>

      <!-- Right Panel: Target Radar List OR 6-Block Telemetry Inspector -->
      <aside class="w-full md:w-[420px] lg:w-[450px] h-full flex flex-col shrink-0">
        <!-- If in Focus Mode: Show Telemetry Inspector -->
        <div v-if="focusedFlight" class="h-full">
          {% include "components/telemetry_inspector.html" %}
        </div>
        <!-- Otherwise: Show Target Flights List -->
        <div v-else class="h-full">
          {% include "components/flight_list.html" %}
        </div>
      </aside>

    </main>

  </div>

  <!-- AQUILA VUE 3 APPLICATION ENGINE -->
  <script src="/static/js/aquila_app.js?v=3.5.0"></script>
</body>
</html>
