{% raw %}
<!-- Sticky Tactical Header -->
<header class="sticky top-0 z-50 backdrop-blur-md bg-slate-950/90 border-b border-slate-800 shadow-2xl px-4 py-2.5">
  <div class="max-w-[1920px] mx-auto flex flex-col md:flex-row items-center justify-between gap-3">
    
    <!-- Logo & Brand Identity -->
    <div class="flex items-center space-x-3 cursor-pointer select-none" @click="quitterFocus">
      <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cyan-500 to-slate-900 p-0.5 shadow-lg shadow-cyan-500/20 border border-cyan-400/40 flex items-center justify-center">
        <span class="text-xl">✈️</span>
      </div>
      <div>
        <div class="flex items-center space-x-2">
          <h1 class="font-extrabold text-base tracking-wider text-white uppercase">AQUILA <span class="text-cyan-400 font-mono">AVIATION INTEL</span></h1>
          <span class="px-2 py-0.5 rounded text-[10px] font-mono font-bold bg-cyan-500/10 text-cyan-300 border border-cyan-500/30">v3.1 HYBRID 2D/3D</span>
        </div>
        <p class="text-[11px] text-slate-400 font-mono">Surveillance Aérienne Temps Réel • ICAO Doc 8643</p>
      </div>
    </div>

    <!-- Live Telemetry Status & View Controls -->
    <div class="flex items-center flex-wrap gap-2">
      <!-- Live Feed Pulse Badge -->
      <div class="flex items-center space-x-2 px-3 py-1.5 bg-slate-900/90 border border-slate-700/70 rounded-xl text-xs font-mono text-slate-300">
        <span class="w-2.5 h-2.5 rounded-full bg-emerald-400 radar-live-indicator shadow-sm shadow-emerald-500"></span>
        <span class="font-semibold text-white">{{ feedSource }}</span>
        <span class="text-slate-500">•</span>
        <span class="text-cyan-400 font-bold">{{ totalFlightsCount }} aéronefs</span>
        <span v-if="corporateCount > 0" class="text-amber-400 font-bold">({{ corporateCount }} VIP)</span>
      </div>

      <!-- 2D / 3D Mode Switch Buttons -->
      <div class="flex items-center bg-slate-900 border border-slate-700/80 rounded-xl p-0.5">
        <button 
          @click="basculerVue('2d')" 
          :class="viewMode === '2d' ? 'bg-cyan-500 text-slate-950 font-bold shadow-md shadow-cyan-500/20' : 'text-slate-400 hover:text-slate-200'"
          class="px-3 py-1.5 rounded-lg text-xs font-mono transition flex items-center space-x-1"
        >
          <span>🗺️</span>
          <span>2D TACTIQUE</span>
        </button>
        <button 
          @click="basculerVue('3d')" 
          :class="viewMode === '3d' ? 'bg-cyan-500 text-slate-950 font-bold shadow-md shadow-cyan-500/20' : 'text-slate-400 hover:text-slate-200'"
          class="px-3 py-1.5 rounded-lg text-xs font-mono transition flex items-center space-x-1"
        >
          <span>🌐</span>
          <span>3D GLOBE</span>
        </button>
      </div>

      <!-- Filter Buttons: All vs Corporate -->
      <div class="flex items-center bg-slate-900 border border-slate-700/80 rounded-xl p-0.5">
        <button 
          @click="setCorporateOnly(false)" 
          :class="!corporateOnly ? 'bg-slate-800 text-white font-bold' : 'text-slate-400 hover:text-slate-200'"
          class="px-3 py-1.5 rounded-lg text-xs font-mono transition"
        >
          TOUS LES VOLS
        </button>
        <button 
          @click="setCorporateOnly(true)" 
          :class="corporateOnly ? 'bg-amber-500/20 text-amber-300 font-bold border border-amber-500/40 shadow-sm' : 'text-slate-400 hover:text-slate-200'"
          class="px-3 py-1.5 rounded-lg text-xs font-mono transition flex items-center space-x-1"
        >
          <span>⭐</span>
          <span>CORPORATE</span>
        </button>
      </div>

      <!-- SÉLECTEUR DYNAMIQUE D'ENTREPRISES ACTIVES (Affiché UNIQUEMENT si au moins 1 avion actif) -->
      <div v-if="activeCompanies.length > 0" class="flex items-center space-x-1">
        <div class="relative">
          <select 
            v-model="selectedCompany" 
            @change="onCompanyChange"
            class="pl-7 pr-8 py-1.5 bg-slate-900 border border-amber-500/50 hover:border-amber-400 rounded-xl text-xs font-mono font-bold text-amber-300 focus:outline-none focus:ring-1 focus:ring-amber-400 cursor-pointer appearance-none shadow-sm shadow-amber-500/10 transition"
          >
            <option value="">🏢 TOUTES LES ENTREPRISES ACTIVES ({{ activeCompanies.length }})</option>
            <option v-for="comp in activeCompanies" :key="comp.name" :value="comp.name">
              🏢 {{ comp.name }} ({{ comp.count }} aéronef{{ comp.count > 1 ? 's' : '' }} en vol)
            </option>
          </select>
          <span class="absolute left-2.5 top-2 text-xs text-amber-400">🏢</span>
          <span class="absolute right-2.5 top-2.5 text-[9px] text-amber-400 pointer-events-none">▼</span>
        </div>

        <button 
          v-if="selectedCompany"
          @click="resetCompanyFilter" 
          class="p-1.5 bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 border border-rose-500/40 rounded-xl text-xs font-mono transition"
          title="Réinitialiser le filtre entreprise"
        >
          ✕
        </button>
      </div>
    </div>

    <!-- Search Bar & Refresh -->
    <div class="flex items-center space-x-2 w-full md:w-auto">
      <div class="relative flex-1 md:w-72">
        <input 
          v-model="searchQuery"
          @input="onSearchChange"
          type="text" 
          placeholder="Indicatif, ICAO24, Immat, Opérateur..."
          class="w-full pl-8 pr-4 py-1.5 bg-slate-900 border border-slate-700 rounded-xl text-xs text-white placeholder-slate-500 font-mono focus:outline-none focus:border-cyan-500 transition"
        />
        <span class="absolute left-2.5 top-2 text-xs text-slate-500">🔍</span>
      </div>

      <button 
        @click="chargerDonnees(true)" 
        :disabled="isLoading"
        class="px-3 py-1.5 bg-slate-900 hover:bg-slate-800 border border-slate-700 rounded-xl text-xs font-mono text-cyan-300 hover:text-cyan-200 transition flex items-center space-x-1.5 shrink-0"
        title="Rafraîchir la télémétrie maintenant"
      >
        <span :class="{'animate-spin': isLoading}">🔄</span>
        <span class="hidden sm:inline">{{ isLoading ? 'Sync...' : 'ACTUALISER' }}</span>
      </button>
    </div>

  </div>
</header>
{% endraw %}
